name: Test

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
        default: main
      environment:
        required: true
        type: string
      test_type:
        required: true
        type: string
    secrets:
      pat_token:
        required: true

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  test:
    name: ${{ inputs.test_type == 'integration' && 'Integration Tests' || 'Unit Tests' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAT_TOKEN: ${{ secrets.pat_token }}

    steps:
      # Checkout and setup
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up NPM
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

      - name: Run unit tests
        if: ${{ inputs.test_type == 'unit' }}
        run: ./gradlew :laa-submit-a-bulk-claim-ui:test :laa-submit-a-bulk-claim-ui:jacocoTestCoverageVerification
        env:
          GITHUB_TOKEN: ${{ secrets.pat_token }}

      - name: Integration test
        if: ${{ inputs.test_type == 'integration' }}
        run: ./gradlew integrationTest
        env:
          GITHUB_TOKEN: ${{ secrets.pat_token }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ format('{0}-test-results', inputs.test_type) }}
          path: ${{ inputs.test_type == 'integration' && 'laa-submit-a-bulk-claim-ui/build/test-results/integrationTest' || 'laa-submit-a-bulk-claim-ui/build/test-results/test' }}
          retention-days: 14
          if-no-files-found: warn

      - name: Upload checkstyle report
        if: ${{ always() && inputs.test_type == 'unit' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-checkstyle-report
          path: laa-submit-a-bulk-claim-ui/build/reports/checkstyle
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ format('{0}-test-report', inputs.test_type) }}
          path: ${{ inputs.test_type == 'integration' && 'laa-submit-a-bulk-claim-ui/build/reports/tests/integrationTest' || 'laa-submit-a-bulk-claim-ui/build/reports/tests/test' }}
          retention-days: 14
          if-no-files-found: warn

      - name: Upload jacoco coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ format('{0}-jacoco-coverage-report', inputs.test_type) }}
          path: laa-submit-a-bulk-claim-ui/build/reports/jacoco
          retention-days: 14
          if-no-files-found: warn
