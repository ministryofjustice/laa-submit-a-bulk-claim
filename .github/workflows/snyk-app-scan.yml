name: Dependency Security Scan

on:
  push:

permissions:
  contents: read
  security-events: write

jobs:
  vulnerability-scan-app:
    name: Vulnerability Scan - Application
    runs-on: ubuntu-latest
    env:
      SNYK_TEST_EXCLUDE: build,generated
      SNYK_TARGET_REFERENCE: main
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: corretto

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Snyk CLI
        run: npm install --global snyk@1.1306.4

      - name: Obtain Short-lived Snyk token
        id: auth
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/snyk-auth@6db001458db30ae747d9eb8eb25707ce52b359bc
        with:
          client_id: ${{ secrets.SNYK_CLIENT_ID }}
          client_secret: ${{ secrets.SNYK_CLIENT_SECRET }}

      - name: Run Snyk dependency scan
        id: snyk
        continue-on-error: true
        run: |
          snyk test \
            --file=laa-submit-a-bulk-claim-ui/build.gradle \
            --all-sub-projects \
            --package-manager=gradle \
            --severity-threshold=high \
            --json-file-output=snyk-app.json
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish Snyk dependency summary
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys

          path = "snyk-app.json"
          if not os.path.exists(path):
              print("No Snyk JSON output found.")
              sys.exit(0)

          with open(path) as f:
              root = json.load(f)

          results = root if isinstance(root, list) else [root]

          flat = []
          for result in results:
              if not isinstance(result, dict):
                  continue

              vulns = result.get("vulnerabilities")
              if isinstance(vulns, list):
                  flat.extend(v for v in vulns if isinstance(v, dict))
              elif isinstance(result.get("issues"), dict):
                  issues = result["issues"].get("vulnerabilities", [])
                  if isinstance(issues, list):
                      flat.extend(v for v in issues if isinstance(v, dict))

          total = len(flat)
          by_sev = {"low": 0, "medium": 0, "high": 0, "critical": 0}
          for v in flat:
              sev = str(v.get("severity", "")).lower()
              if sev in by_sev:
                  by_sev[sev] += 1

          summary = [
              "## Snyk application dependency scan",
              "",
              f"- Total vulnerabilities: {total}",
              f"- Low: {by_sev['low']}",
              f"- Medium: {by_sev['medium']}",
              f"- High: {by_sev['high']}",
              f"- Critical: {by_sev['critical']}",
              "",
          ]

          if flat:
              summary += ["| Package | Severity | Title |", "| --- | --- | --- |"]
              for v in flat[:10]:
                  pkg = v.get("packageName", v.get("package", "unknown"))
                  sev = v.get("severity", "unknown")
                  title = v.get("title", v.get("name", "unknown"))
                  summary.append(f"| {pkg} | {sev} | {title} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(summary) + "\n")
          PY

      - name: Upload Snyk JSON report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snyk-app-report
          path: snyk-app.json

      - name: Fail when Snyk finds vulnerabilities
        if: ${{ steps.snyk.outcome == 'failure' }}
        run: exit 1