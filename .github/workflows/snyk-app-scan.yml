name: Dependency Security Scan

on:
  push:

permissions:
  contents: read
  security-events: write

jobs:
  vulnerability-scan-app:
    name: Vulnerability Scan - Application
    runs-on: ubuntu-latest
    env:
      SNYK_TEST_EXCLUDE: build,generated
      SNYK_TARGET_REFERENCE: main
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: corretto

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Snyk CLI
        run: npm install --global snyk@1.1306.4

      - name: Obtain Short-lived Snyk token
        id: auth
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/snyk-auth@6db001458db30ae747d9eb8eb25707ce52b359bc
        with:
          client_id: ${{ secrets.SNYK_CLIENT_ID }}
          client_secret: ${{ secrets.SNYK_CLIENT_SECRET }}

      - name: Run Snyk dependency scan
        id: snyk
        continue-on-error: true
        run: |
          snyk test \
            --file=laa-submit-a-bulk-claim-ui/build.gradle \
            --all-sub-projects \
            --package-manager=gradle \
            --severity-threshold=high \
            --json-file-output=snyk-app.json
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish Snyk dependency summary
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys

          path = "snyk-app.json"
          if not os.path.exists(path):
              print("No Snyk JSON output found.")
              raise SystemExit(0)

          with open(path) as f:
              root = json.load(f)

          results = root if isinstance(root, list) else [root]
          flat = []

          for result in results:
              if not isinstance(result, dict):
                  continue
              vulns = result.get("vulnerabilities", [])
              if isinstance(vulns, list):
                  flat.extend(v for v in vulns if isinstance(v, dict))

          summary = [
              "## Snyk application dependency scan",
              "",
              "| Package | Severity | Fixed in | Upgrade path |",
              "| --- | --- | --- | --- |"
          ]

          for v in flat[:25]:
              pkg = v.get("packageName", v.get("package", "unknown"))
              sev = v.get("severity", "unknown").title()

              fixed_in = v.get("fixedIn") or v.get("nearestFixedInVersion") or "Not available"
              if isinstance(fixed_in, list):
                  fixed_in = ", ".join(map(str, fixed_in))
              if fixed_in in (None, "", "None"):
                  fixed_in = "Not available"

              upgrade = v.get("upgradePath") or []
              if isinstance(upgrade, list):
                  upgrade = " -> ".join(str(x) for x in upgrade if x)
              elif not upgrade:
                  upgrade = "No direct upgrade path"

              title = v.get("title", "No title")
              summary.append(f"| {pkg} | {sev} | {fixed_in} | {upgrade} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(summary) + "\n")
          PY

      - name: Upload Snyk JSON report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snyk-app-report
          path: snyk-app.json

      - name: Fail when Snyk finds vulnerabilities
        if: ${{ steps.snyk.outcome == 'failure' }}
        run: exit 1

  vulnerability-scan-code:
    name: Vulnerability Scan - Code
    runs-on: ubuntu-latest
    env:
      SNYK_TEST_EXCLUDE: build,generated
      SNYK_TARGET_REFERENCE: main
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: corretto

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Snyk CLI
        run: npm install --global snyk@1.1306.4

      - name: Obtain Short-lived Snyk token
        id: auth
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/snyk-auth@6db001458db30ae747d9eb8eb25707ce52b359bc
        with:
          client_id: ${{ secrets.SNYK_CLIENT_ID }}
          client_secret: ${{ secrets.SNYK_CLIENT_SECRET }}

      - name: Run Snyk code vulnerability scan
        id: snyk-code
        continue-on-error: true
        run: snyk code test --file=laa-submit-a-bulk-claim-ui/build.gradle --all-sub-projects --package-manager=gradle --severity-threshold=low --sarif-file-output=snyk-code.sarif
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Upload result to GitHub Code Scanning
        if: ${{ always() && hashFiles('snyk-app.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f
        with:
          sarif_file: snyk-coded.sarif
          category: snyk-code

      - name: Fail when Snyk finds vulnerabilities
        if: ${{ steps.snyk.outcome == 'failure' }}
        run: exit 1