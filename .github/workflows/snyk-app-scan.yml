name: Security Scan

on:
  push:

permissions:
  contents: read
  security-events: write

jobs:
  vulnerability-scan-app:
    name: Vulnerability Scan - Application
    runs-on: ubuntu-latest
    env:
      SNYK_TEST_EXCLUDE: build,generated
      SNYK_TARGET_REFERENCE: main
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: corretto

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Snyk CLI
        run: npm install --global snyk@1.1306.4

      - name: Obtain Short-lived Snyk token
        id: auth
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/snyk-auth@6db001458db30ae747d9eb8eb25707ce52b359bc
        with:
          client_id: ${{ secrets.SNYK_CLIENT_ID }}
          client_secret: ${{ secrets.SNYK_CLIENT_SECRET }}

      - name: Run Snyk dependency scan
        id: snyk
        continue-on-error: true
        run: |
          snyk test \
            --file=laa-submit-a-bulk-claim-ui/build.gradle \
            --all-sub-projects \
            --package-manager=gradle \
            --severity-threshold=high \
            --json-file-output=snyk-app.json
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish condensed Snyk dependency summary
        id: summary
        if: always()
        run: |
          python - <<'PY'
          import json, os

          path = "snyk-app.json"
          if not os.path.exists(path):
              print("No Snyk JSON output found.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("has_fixable_vulns=false\n")
              raise SystemExit(0)

          with open(path) as f:
              root = json.load(f)

          results = root if isinstance(root, list) else [root]
          findings = {}
          fixable_found = False

          for result in results:
              if not isinstance(result, dict):
                  continue

              project = (
                  result.get("projectName")
                  or result.get("displayTargetFile")
                  or result.get("targetFile")
                  or "unknown"
              )

              for vuln in result.get("vulnerabilities", []):
                  if not isinstance(vuln, dict):
                      continue

                  pkg = vuln.get("packageName", "unknown")
                  sev = str(vuln.get("severity", "unknown")).lower()
                  current_version = vuln.get("version") or vuln.get("packageVersion") or "unknown"

                  fixed = vuln.get("fixedIn") or vuln.get("nearestFixedInVersion")
                  if isinstance(fixed, list):
                      fixed = ", ".join(str(x) for x in fixed if x)
                  elif fixed in (None, "", "None"):
                      fixed = "Not available"

                  upgrade = vuln.get("upgradePath") or []
                  if isinstance(upgrade, list):
                      upgrade = " -> ".join(str(x) for x in upgrade if x and x is not False)
                  if not upgrade:
                      upgrade = "No direct upgrade path"

                  has_fix = False
                  if isinstance(fixed, str) and fixed not in ("Not available", "None"):
                      has_fix = True
                  elif isinstance(upgrade, str) and upgrade and upgrade != "No direct upgrade path":
                      has_fix = True

                  if has_fix:
                      fixable_found = True

                  key = (project, pkg)
                  item = findings.setdefault(key, {
                      "severity": sev,
                      "fixed": set(),
                      "upgrade": set(),
                      "paths": 0,
                      "current_version": set(),
                  })
                  item["severity"] = max([item["severity"], sev], key=["low","medium","high","critical"].index)
                  if isinstance(fixed, str):
                      item["fixed"].add(fixed)
                  if isinstance(upgrade, str):
                      item["upgrade"].add(upgrade)
                  item["paths"] += 1
                  item["current_version"].add(str(current_version))

          rows = [
              "## Snyk application dependency scan",
              "",
              "| Project | Dependency | Current version | Highest severity | Fixed in | Upgrade path | Affected paths |",
              "| --- | --- | --- | --- | --- | --- | --- |"
          ]

          for (project, pkg), info in sorted(findings.items(), key=lambda kv: (kv[0][0], kv[0][1])):
              fixed = ", ".join(sorted(info["fixed"]))
              upgrade = ", ".join(sorted(info["upgrade"])) or "No direct upgrade path"
              current_version = ", ".join(sorted(info["current_version"]))
              rows.append(f"| {project} | {pkg} | {current_version} | {info['severity'].title()} | {fixed} | {upgrade} | {info['paths']} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(rows) + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"has_fixable_vulns={'true' if fixable_found else 'false'}\n")
          PY

      - name: Upload Snyk JSON report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snyk-app-report
          path: snyk-app.json

      - name: Fail when Snyk finds fixable vulnerabilities
        if: ${{ steps.snyk.outcome == 'failure' && steps.summary.outputs.has_fixable_vulns == 'true' }}
        run: exit 1

  vulnerability-scan-code:
    name: Vulnerability Scan - Code
    runs-on: ubuntu-latest
    env:
      SNYK_TEST_EXCLUDE: build,generated
      SNYK_TARGET_REFERENCE: main
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: corretto

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Snyk CLI
        run: npm install --global snyk@1.1306.4

      - name: Obtain Short-lived Snyk token
        id: auth
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/snyk-auth@6db001458db30ae747d9eb8eb25707ce52b359bc
        with:
          client_id: ${{ secrets.SNYK_CLIENT_ID }}
          client_secret: ${{ secrets.SNYK_CLIENT_SECRET }}

      - name: Run Snyk code vulnerability scan
        id: snyk-code
        continue-on-error: true
        run: snyk code test --file=laa-submit-a-bulk-claim-ui/build.gradle --all-sub-projects --package-manager=gradle --severity-threshold=low --sarif-file-output=snyk-code.sarif
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Upload result to GitHub Code Scanning
        if: ${{ always() && hashFiles('snyk-code.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Fail when Snyk finds vulnerabilities
        if: ${{ steps.snyk.outcome == 'failure' }}
        run: exit 1