name: Daily Snyk scan

on:
  schedule:
    - cron: '0 6,15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-image:
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/ecr-publish-image.yml@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
    with:
      jar_subproject: 'laa-submit-a-bulk-claim-ui'
      image_version: daily-snyk-latest
      publish: 'true'
      java_version: 25
      image_scan: 'false'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      ecr_repository: ${{ vars.LAA_SUBMIT_A_BULK_CLAIM_ECR_REPOSITORY }}
      ecr_region: ${{ vars.LAA_SUBMIT_A_BULK_CLAIM_ECR_REGION }}
      ecr_role_to_assume: ${{ secrets.LAA_SUBMIT_A_BULK_CLAIM_ECR_ROLE_TO_ASSUME }}
      snyk_client_id: ${{ secrets.SNYK_CLIENT_ID }}
      snyk_client_secret: ${{ secrets.SNYK_CLIENT_SECRET }}

  snyk-image-scan:
    needs: [ upload-image ]
    uses: ./.github/workflows/snyk-docker-scan.yml
    permissions:
      contents: read
      security-events: write
      id-token: write
    with:
      branch: ${{ github.sha }}
      image_tag: ${{ needs.upload-image.outputs.published_image_version }}
      aws_region: ${{ vars.LAA_SUBMIT_A_BULK_CLAIM_ECR_REGION }}
      ecr_repository: ${{ vars.LAA_SUBMIT_A_BULK_CLAIM_ECR_REPOSITORY }}
      image_scan_threshold: 'medium'
    secrets:
      ECR_ROLE_TO_ASSUME: ${{ secrets.LAA_SUBMIT_A_BULK_CLAIM_ECR_ROLE_TO_ASSUME }}
      SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
      SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}

  notify-slack:
    needs: [ upload-image, snyk-image-scan ]
    if: ${{ always() && (needs.upload-image.result == 'failure' || needs.snyk-image-scan.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.CWC_SLACK_APP_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: >
              :x: <!here> Daily Snyk scan failed for `${{ github.repository }}`.
            
              Review the workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
              Review the code scanning results: https://github.com/${{ github.repository }}/security/code-scanning
