name: Daily Snyk scan

on:
  schedule:
    - cron: '0 6,15 * * *'
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  snyk-scan:
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/ecr-publish-image.yml@4daa796eff475c7a107e17daf4e4882b8a1b949b # v2.3.0
    with:
      jar_subproject: 'laa-submit-a-bulk-claim-ui'
      image_version: daily-snyk-latest
      publish: 'true'
      java_version: 25
      image_scan: 'false'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      ecr_repository: ${{ vars.LAA_SUBMIT_A_BULK_CLAIM_ECR_REPOSITORY }}
      ecr_region: ${{ vars.LAA_SUBMIT_A_BULK_CLAIM_ECR_REGION }}
      ecr_role_to_assume: ${{ secrets.LAA_SUBMIT_A_BULK_CLAIM_ECR_ROLE_TO_ASSUME }}
      snyk_client_id: ${{ secrets.SNYK_CLIENT_ID }}
      snyk_client_secret: ${{ secrets.SNYK_CLIENT_SECRET }}

  snyk-image-scan:
    needs: [ snyk-scan ]
    uses: ./.github/workflows/snyk-docker-scan.yml
    permissions:
      contents: read
      security-events: write
      id-token: write
    with:
      branch: ${{ github.sha }}
      image_tag: ${{ needs.snyk-scan.outputs.published_image_version }}
      aws_region: ${{ vars.LAA_SUBMIT_A_BULK_CLAIM_ECR_REGION }}
      ecr_repository: ${{ vars.LAA_SUBMIT_A_BULK_CLAIM_ECR_REPOSITORY }}
      image_scan_threshold: 'medium'
      image_scan_fails_on: 'all'
    secrets:
      ECR_ROLE_TO_ASSUME: ${{ secrets.LAA_SUBMIT_A_BULK_CLAIM_ECR_ROLE_TO_ASSUME }}
      SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
      SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}

  notify-slack:
    needs: [ snyk-image-scan ]
    if: ${{ always() && needs.snyk-image-scan.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@fc46ded2fc4d7f11bfa62864526f920cf1a1167d # v3.0.4
        with:
          webhook: ${{ secrets.CWC_SLACK_APP_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: >
              :x: Daily Snyk scan failed for `${{ github.repository }}`.
              Review the workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
