name: Build

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
        default: main
      version:
        required: false
        type: string
        default: ''
      java_version:
        required: false
        type: string
        default: '25'
    outputs:
      published_artifact_version:
        description: The version of the published artifact.
        value: ${{ jobs.build.outputs.published_artifact_version }}
    secrets:
      PAT_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      published_artifact_version: ${{ steps.capture-version.outputs.published_artifact_version }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ inputs.java_version }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Assemble app and run checkstyle/spotless
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BUILD_ARGS=(":laa-submit-a-bulk-claim-ui:assemble" ":laa-submit-a-bulk-claim-ui:checkstyleAll" ":laa-submit-a-bulk-claim-ui:spotlessCheck")
          if [ -n "${VERSION:-}" ]; then
            BUILD_ARGS+=("-Pversion=$VERSION")
          fi
          ./gradlew "${BUILD_ARGS[@]}"

      - name: Upload checkstyle report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkstyle-report
          path: laa-submit-a-bulk-claim-ui/build/reports/checkstyle
          retention-days: 14
          if-no-files-found: warn

      - name: Publish package to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PUBLISH_ARGS=()
          if [ -n "${VERSION:-}" ]; then
            PUBLISH_ARGS+=("-Pversion=$VERSION")
          fi
          ./gradlew :laa-submit-a-bulk-claim-ui:publish "${PUBLISH_ARGS[@]}"

      - name: Capture published versions
        id: capture-version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          fi
          echo "published_artifact_version=${VERSION}" >> "$GITHUB_OUTPUT"
