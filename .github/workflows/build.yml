name: Build

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
        default: main
      version:
        required: false
        type: string
        default: ''
      java_version:
        required: false
        type: string
        default: '25'
      java_distribution:
        required: false
        type: string
        default: temurin
    outputs:
      published_artifact_version:
        description: The version of the published artifact.
        value: ${{ jobs.build.outputs.published_artifact_version }}
    secrets:
      PAT_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      published_artifact_version: ${{ steps.capture-version.outputs.published_artifact_version }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Assemble app and run checkstyle
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BUILD_ARGS=(":laa-submit-a-bulk-claim-ui:assemble" ":laa-submit-a-bulk-claim-ui:checkstyleAll")
          if [ -n "$VERSION" ]; then
            BUILD_ARGS+=("-Pversion=$VERSION")
          fi
          ./gradlew "${BUILD_ARGS[@]}"

      - name: Upload checkstyle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkstyle-report
          path: laa-submit-a-bulk-claim-ui/build/reports/checkstyle
          retention-days: 14
          if-no-files-found: warn

      - name: Publish package to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PUBLISH_ARGS=()
          if [ -n "$VERSION" ]; then
            PUBLISH_ARGS+=("-Pversion=$VERSION")
          fi
          ./gradlew :laa-submit-a-bulk-claim-ui:publish "${PUBLISH_ARGS[@]}"

      - name: Capture published versions
        id: capture-version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          fi
          echo "published_artifact_version=${VERSION}" >> "$GITHUB_OUTPUT"
