name: Build

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
        default: main
      version:
        required: false
        type: string
        default: ''
      release_type:
        description: >
          Release type: major | minor | patch | none. Only used when no version is supplied.
          Leave empty to auto-detect from Conventional Commits on main.
        required: false
        type: string
        default: ''
      java_version:
        required: false
        type: string
        default: '25'
    outputs:
      published_artifact_version:
        description: The version of the published artifact.
        value: ${{ jobs.build.outputs.published_artifact_version }}
    secrets:
      PAT_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      published_artifact_version: ${{ steps.capture-version.outputs.published_artifact_version }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        id: compute
        if: >-
          ${{
            inputs.version == '' &&
            inputs.release_type != 'none' &&
            (inputs.release_type != '' || github.ref == 'refs/heads/main')
          }}
        uses: ministryofjustice/laa-ccms-common-workflows/.github/actions/compute-version@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
        with:
          bump: ${{ inputs.release_type }}

      - name: Resolve version
        id: resolve-version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          NEXT_VERSION: ${{ steps.compute.outputs.next_version }}
        run: |
          set -euo pipefail
          # Priority: supplied version > computed release version > gradle.properties
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          elif [ -n "${NEXT_VERSION:-}" ]; then
            VERSION="${NEXT_VERSION#v}"
          else
            VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ inputs.java_version }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Assemble app and run checkstyle/spotless
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ steps.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          ./gradlew :laa-submit-a-bulk-claim-ui:assemble :laa-submit-a-bulk-claim-ui:checkstyleAll :laa-submit-a-bulk-claim-ui:spotlessCheck -Pversion="$VERSION"

      - name: Upload checkstyle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkstyle-report
          path: laa-submit-a-bulk-claim-ui/build/reports/checkstyle
          retention-days: 14
          if-no-files-found: warn

      - name: Create Git tag
        id: create-tag
        if: ${{ steps.compute.outputs.next_version != '' }}
        env:
          GTAG: ${{ steps.compute.outputs.next_version }}
        run: |
          set -eu
          git config user.name  "github-actions-bot[bot]"
          git config user.email "github-actions-bot[bot]@users.noreply.github.com"
          if git ls-remote --tags origin | grep -q "refs/tags/${GTAG}$"; then
            echo "Tag ${GTAG} already exists on remote. Skipping."
            echo "gtag=${GTAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Creating Git tag [${GTAG}]"
          git tag -a "$GTAG" -m "Release ${GTAG}"
          git push origin "$GTAG" || {
            EXIT=$?
            if git ls-remote --tags origin | grep -q "refs/tags/${GTAG}$"; then
              echo "Tag ${GTAG} was already pushed (race condition). Skipping."
            else
              echo "::error::Failed to push tag ${GTAG} (exit ${EXIT})"
              exit $EXIT
            fi
          }
          echo "gtag=${GTAG}" >> "$GITHUB_OUTPUT"

      - name: Publish package to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ steps.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          ./gradlew :laa-submit-a-bulk-claim-ui:publish -Pversion="$VERSION"

      - name: Create GitHub Release
        if: ${{ steps.create-tag.outputs.gtag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GTAG: ${{ steps.create-tag.outputs.gtag }}
        run: |
          set -eu
          if gh release view "$GTAG" >/dev/null 2>&1; then
            echo "Release ${GTAG} already exists. Skipping."
            exit 0
          fi
          echo "Creating GitHub Release [${GTAG}]"
          gh release create "$GTAG" --verify-tag --title "$GTAG" --generate-notes

      - name: Capture published versions
        id: capture-version
        env:
          VERSION: ${{ steps.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          echo "published_artifact_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Artifact version: \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
