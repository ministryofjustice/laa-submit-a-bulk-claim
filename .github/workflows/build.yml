name: Build

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
        default: main
      version:
        required: false
        type: string
        default: ''
      release_type:
        required: false
        type: string
        default: ''
      java_version:
        required: false
        type: string
        default: '25'
    outputs:
      published_artifact_version:
        description: The version of the published artifact.
        value: ${{ jobs.build.outputs.published_artifact_version }}
    secrets:
      PAT_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      published_artifact_version: ${{ steps.capture-version.outputs.published_artifact_version }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ inputs.java_version }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Compute release version
        id: compute-version
        uses: ministryofjustice/laa-ccms-common-workflows/.github/actions/compute-version@0c06c747af49e3efb703717e6185cf693494d5a4 # v2.4.2
        if: ${{ inputs.version == '' && inputs.release_type != '' }}
        with:
          release_type: ${{ inputs.release_type }}

      - name: Assemble app and run checkstyle
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          BUMP_TYPE: ${{ steps.compute-version.outputs.bump_type }}
          MAJOR: ${{ steps.compute-version.outputs.major }}
          MINOR: ${{ steps.compute-version.outputs.minor }}
          PATCH: ${{ steps.compute-version.outputs.patch }}
        run: |
          set -euo pipefail
          RESOLVED_VERSION="${VERSION}"
          if [ -z "$RESOLVED_VERSION" ] && [ -n "$RELEASE_TYPE" ]; then
            case "${BUMP_TYPE:-}" in
              major) RESOLVED_VERSION="$((MAJOR + 1)).0.0" ;;
              minor) RESOLVED_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch|none|'') RESOLVED_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              *) echo "Unsupported bump type: ${BUMP_TYPE}" >&2; exit 1 ;;
            esac
          fi
          BUILD_ARGS=(":laa-submit-a-bulk-claim-ui:assemble" ":laa-submit-a-bulk-claim-ui:checkstyleAll")
          if [ -n "$RESOLVED_VERSION" ]; then
            BUILD_ARGS+=("-Pversion=$RESOLVED_VERSION")
          fi
          ./gradlew "${BUILD_ARGS[@]}"

      - name: Upload checkstyle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkstyle-report
          path: laa-submit-a-bulk-claim-ui/build/reports/checkstyle
          retention-days: 14
          if-no-files-found: warn

      - name: Publish package to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          BUMP_TYPE: ${{ steps.compute-version.outputs.bump_type }}
          MAJOR: ${{ steps.compute-version.outputs.major }}
          MINOR: ${{ steps.compute-version.outputs.minor }}
          PATCH: ${{ steps.compute-version.outputs.patch }}
        run: |
          set -euo pipefail
          RESOLVED_VERSION="${VERSION}"
          if [ -z "$RESOLVED_VERSION" ] && [ -n "$RELEASE_TYPE" ]; then
            case "${BUMP_TYPE:-}" in
              major) RESOLVED_VERSION="$((MAJOR + 1)).0.0" ;;
              minor) RESOLVED_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch|none|'') RESOLVED_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              *) echo "Unsupported bump type: ${BUMP_TYPE}" >&2; exit 1 ;;
            esac
          fi
          PUBLISH_ARGS=()
          if [ -n "$RESOLVED_VERSION" ]; then
            PUBLISH_ARGS+=("-Pversion=$RESOLVED_VERSION")
          fi
          ./gradlew :laa-submit-a-bulk-claim-ui:publish "${PUBLISH_ARGS[@]}"

      - name: Capture published versions
        id: capture-version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          BUMP_TYPE: ${{ steps.compute-version.outputs.bump_type }}
          MAJOR: ${{ steps.compute-version.outputs.major }}
          MINOR: ${{ steps.compute-version.outputs.minor }}

          PATCH: ${{ steps.compute-version.outputs.patch }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ] && [ -n "$RELEASE_TYPE" ]; then
            case "${BUMP_TYPE:-}" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch|none|'') VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              *) echo "Unsupported bump type: ${BUMP_TYPE}" >&2; exit 1 ;;
            esac
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          fi
          echo "published_artifact_version=${VERSION}" >> "$GITHUB_OUTPUT"
