name: Delete UAT preview deployment (manual)

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Helm release to remove, exactly as `helm list -n <namespace>` shows it"
        required: true
        type: string
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  cleanup-uat:
    runs-on: ubuntu-latest
    environment: uat
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cleanup uat
        uses: ./.github/actions/cleanup_branch
        with:
          release-name: ${{ inputs.release_name }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
