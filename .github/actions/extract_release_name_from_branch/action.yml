name: "Extract Release Name"
description: "Converts a branch name and PR number into a Helm release name"
inputs:
  branch_name:
    description: "The original branch name"
    required: true
  pr_number:
    description: "Pull request number, keeps the release name unique per PR"
    required: true
outputs:
  release_name:
    description: "Formatted release name"
    value: ${{ steps.release.outputs.release_name }}
runs:
  using: "composite"
  steps:
    - id: release
      shell: bash
      env:
        BRANCH_NAME: ${{ inputs.branch_name }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        set -euo pipefail
        suffix="pr${PR_NUMBER:?PR number is required for a unique release name}"
        slug=$(echo "${BRANCH_NAME#*/}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | cut -c1-$((24 - ${#suffix})) | sed 's/^[^a-z]*//; s/-*$//')
        release_name="${slug:+${slug}-}${suffix}"
        echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
        echo "release_name being exported: ${release_name}"
