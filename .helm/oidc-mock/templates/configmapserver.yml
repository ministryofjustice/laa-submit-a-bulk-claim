apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config-map
  namespace: {{ .Release.Namespace }}
data:
  {{- $appLabel := printf "%s-sabc-%s" .Values.sabc.releaseName .Release.Namespace }}
  {{- $appHost := printf "%s.%s" $appLabel .Values.clusterDomain }}
  application-mock-oidc.yml: |
    spring:
      config:
        activate:
          on-profile: mock-oidc
      security:
        oauth2:
          authorizationserver:
            client:
              bulk-claim-client:
                registration:
                  redirect-uris:
                    - "https://{{ $appHost }}/login/oauth2/code/silas-identity"
                  post-logout-redirect-uris:
                    - "https://{{ $appHost }}/logged-out"
      
