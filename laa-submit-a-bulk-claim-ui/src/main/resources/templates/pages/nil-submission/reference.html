<!DOCTYPE HTML>
<html lang="en" class="govuk-template" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{ main-layout :: layout(#{nilSubmission.heading}, ~{::main},
       ~{::#back-link},'nil-submission')}">

<th:block id="back-link">
    <a th:href="@{/nil-submission/period}"
       class="govuk-back-link requires-js"
       th:text="#{common.back}"/>
</th:block>

<main class="govuk-main-wrapper" id="main-content">
    <div class="govuk-width-container">
        <div class="govuk-grid-row">
            <div class="govuk-grid-column-two-thirds" th:object="${nilSubmissionForm}">
                <div th:replace="~{fragments/error-components :: error-summary}"/>
                <div id="nil-submission-hint" class="govuk-hint" th:text="#{nilSubmission.hint}"></div>
                <h1 class="govuk-heading-l" th:text="#{__${'nilSubmission.reference.heading.' + nilSubmissionForm.areaOfLaw.name()}__}"></h1>
                <th:block th:replace="~{fragments/nil-submission-summary :: nil-submission-summary}"/>
                <form class="form" th:action="@{/nil-submission/reference}" method="post">
                    <div class="govuk-form-group"
                         th:classappend="${#fields.hasErrors('submissionReference')} ? ' govuk-form-group--error'">
                        <fieldset class="govuk-fieldset">
                            <div class="govuk-body"
                                 data-module="govuk-radios" id="arias-of-law-input-container">
                                <label class="govuk-label govuk-label--s"
                                      for="submissionReference-input"
                                      th:text="#{__${'nilSubmission.summary.reference.' + nilSubmissionForm.areaOfLaw.name()}__}">
                                </label>
                                <th:block th:replace="~{fragments/error-components :: error-messages('submissionReference')}"/>
                                <div id="nil-submission-example-hint" class="govuk-hint" th:text="#{__${'nilSubmission.summary.example.' + nilSubmissionForm.areaOfLaw.name()}__}"></div>
                                <input class="govuk-input govuk-input--width-10"
                                      id="submissionReference-input"
                                      type="text" th:field="*{submissionReference}"/>
                            </div>
                        </fieldset>
                    </div>
                    <div class="govuk-button-group">
                        <button type="submit" data-prevent-double-click="true" class="govuk-button" data-module="govuk-button"
                                th:text="#{nilSubmission.primaryButton}"/>
                        <a th:href="@{/nil-submission/cancel(destination='UPLOAD')}" th:text="#{nilSubmission.cancel}"
                           class="govuk-link govuk-link--no-visited-state"></a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</html>
