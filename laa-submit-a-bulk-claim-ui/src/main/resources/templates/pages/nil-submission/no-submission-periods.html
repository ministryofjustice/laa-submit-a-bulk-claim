<!DOCTYPE HTML>
<html lang="en" class="govuk-template" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{ main-layout :: layout(#{nilSubmission.heading}, ~{::main},
       ~{::#back-link},'nil-submission')}">

<th:block id="back-link"></th:block>

<main class="govuk-main-wrapper" id="main-content">
    <div class="govuk-grid-row">
        <div class="govuk-grid-column-two-thirds">
            <h1 class="govuk-heading-l" th:text="#{nilSubmission.noPeriods.primary.heading}"></h1>
            <th:block th:replace="~{fragments/nil-submission-summary :: nil-submission-summary}"/>

            <p class="govuk-body" th:text="#{nilSubmission.noPeriods.message}"></p>
            <p class="govuk-body">
                <th:block th:text="#{nilSubmission.noPeriods.goBack}"/>
                <a
                        th:href="@{/nil-submission/cancel(destination='UPLOAD')}"
                        id="submit-a-bulk-claim"
                        class="govuk-link govuk-link--no-visited-state"
                        th:text="#{nilSubmission.submit}">
                </a>
                or
                <a
                        th:href="@{/nil-submission/cancel(destination='SEARCH')}"
                        id="search-for-previous-submission"
                        class="govuk-link govuk-link--no-visited-state"
                        th:text="#{nilSubmission.search}">
                </a>
            </p>
        </div>
    </div>
</main>
</html>
