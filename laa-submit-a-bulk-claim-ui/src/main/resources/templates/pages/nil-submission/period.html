<!DOCTYPE HTML>
<html lang="en" class="govuk-template" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{ layout/main-layout :: layout(#{nilSubmission.heading}, ~{::main},
        ~{::#back-link},'nil-submission')}">

<th:block id="back-link">
    <a th:href="@{/nil-submission/areaoflaw}"
       class="govuk-back-link"
       th:text="#{common.back}"/>
</th:block>
<main class="govuk-main-wrapper" id="main-content">
    <div class="govuk-width-container">
        <div class="govuk-grid-row">
            <div class="govuk-grid-column-full" th:object="${nilSubmissionForm}">
                <div th:replace="~{fragments/error-components :: error-summary}"/>
                <div id="nil-submission-hint" class="govuk-hint" th:text="#{nilSubmission.hint}"></div>
                <h1 class="govuk-heading-l" th:text="#{nilSubmission.period.heading}"/>
                <th:block th:replace="~{fragments/nil-submission-summary :: nil-submission-summary}"/>
                <form class="form" th:action="@{/nil-submission/period}" method="post">
                    <div class="govuk-form-group"
                         th:classappend="${#fields.hasErrors('submissionPeriod')} ? ' govuk-form-group--error'">
                        <fieldset class="govuk-fieldset">
                            <legend class="govuk-fieldset__legend govuk-fieldset__legend--m"
                                    th:text="#{search.submissionPeriod}">
                            </legend>
                            <th:block th:replace="~{fragments/error-components :: error-messages('submissionPeriod')}"/>
                            <div class="govuk-body govuk-input--width-15">
                                <select class="govuk-select"
                                        id="submissionPeriod-input"
                                        th:field="*{submissionPeriod}">

                                    <option value="">Select a submission period</option>

                                    <option
                                            th:each="period, idx : ${submissionPeriods}"
                                            th:value="${period.getKey()}"
                                            th:id="|submissionPeriod-input-${idx.index}|"
                                            th:text="${period.getValue()}">
                                    </option>

                                </select>
                            </div>
                        </fieldset>
                    </div>
                    <div class="govuk-button-group">
                        <button type="submit" data-prevent-double-click="true" class="govuk-button" data-module="govuk-button"
                                th:text="#{nilSubmission.primaryButton}"/>
                        <a th:href="@{/nil-submission/cancel(destination='UPLOAD')}" th:text="#{nilSubmission.cancel}"
                           class="govuk-link govuk-link--no-visited-state"></a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</html>
