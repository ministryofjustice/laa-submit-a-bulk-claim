<!DOCTYPE HTML>
<html lang="en" class="govuk-template" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{ layout/main-layout :: layout(${ufn} ? #{viewClaim.heading(${ufn})} : #{viewClaim.heading.noUfn},~{::main},~{::#back-link},'search-submissions')}">

<th:block id="back-link">
  <a th:href="${viewSubmissionBackLink}"
     class="govuk-back-link"
     th:text="#{common.back}"/>
</th:block>
<main class="govuk-main-wrapper" id="main-content">

  <div class="govuk-width-container">
    <div class="govuk-grid-row">

      <div class="govuk-grid-column-full" th:if="${claimStatus == 'VOID'}">
        <div role="region"
             class="moj-alert moj-alert--error moj-alert--with-heading"
             th:aria-label="#{viewClaim.summary.errorAlertAriaLabel(#{viewClaim.voidedBanner})}"
             data-module="moj-alert">
          <div>
            <svg class="moj-alert__icon" role="presentation" focusable="false"
                 xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" height="30" width="30">
              <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M20.1777 2.5H9.82233L2.5 9.82233V20.1777L9.82233 27.5H20.1777L27.5 20.1777V9.82233L20.1777 2.5ZM10.9155 8.87769L15.0001 12.9623L19.0847 8.87771L21.1224 10.9154L17.0378 15L21.1224 19.0846L19.0847 21.1222L15.0001 17.0376L10.9155 21.1223L8.87782 19.0846L12.9624 15L8.87783 10.9153L10.9155 8.87769Z"
                    fill="currentColor"/>
            </svg>
          </div>
          <div class="moj-alert__content">
            <h2 class="moj-alert__heading" th:text="#{viewClaim.voidedBanner}">
            </h2>
          </div>
          <div class="moj-alert__action">
            <button class="moj-alert__dismiss" hidden>Dismiss</button>
          </div>
        </div>
      </div>

      <div class="govuk-grid-column-full" data-module="laa-print-button">
        <h1 class="govuk-heading-l"
            th:text="|${claimSummary.clientForename()} ${claimSummary.clientSurname()}|"/>

        <p class="govuk-body">
          <span class="govuk-!-font-weight-bold"
                th:text="#{viewClaim.summary.ufn}"></span>:
          <th:block th:text="${claimSummary.uniqueFileNumber()}"></th:block>
          </br>
          <span class="govuk-!-font-weight-bold"
                th:text="#{viewClaim.summary.feeCode}"></span>:
          <th:block th:text="${claimSummary.feeCode()}"></th:block>
        <div class="govuk-summary-card">
          <div class="govuk-summary-card__title-wrapper">
            <h2 class="govuk-summary-card__title" th:text="#{viewClaim.summary.title}"/>
          </div>
          <div class="govuk-summary-card__content">
            <dl class="govuk-summary-list">
              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key" th:text="#{viewClaim.summary.clientName}"/>
                <dd class="govuk-summary-list__value" th:text="|${claimSummary.clientForename()} ${claimSummary.clientSurname()}|"/>
              </div>
              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key" th:text="#{viewClaim.summary.ufn.full}"/>
                <dd class="govuk-summary-list__value" th:text="${claimSummary.uniqueFileNumber()}"/>
              </div>
              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key" th:text="#{viewClaim.summary.officeAccountNumber}"/>
                <dd class="govuk-summary-list__value" th:text="'TODO'"/>
              </div>
              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key" th:text="#{viewClaim.summary.dateSubmitted}"/>
                <dd class="govuk-summary-list__value" th:text="'TODO'"/>
              </div>
              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key" th:text="#{viewClaim.summary.areaOfLaw}"/>
                <dd class="govuk-summary-list__value" th:text="${claimSummary.areaOfLaw()}"/>
              </div>
              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key" th:text="#{viewClaim.summary.categoryOfLaw}"/>
                <dd class="govuk-summary-list__value" th:text="'TODO'"/>
              </div>
              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key" th:text="#{viewClaim.summary.feeCode}"/>
                <dd class="govuk-summary-list__value" th:text="${claimSummary.feeCode()}"/>
              </div>
              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key" th:text="#{viewClaim.summary.feeCodeDescription}"/>
                <dd class="govuk-summary-list__value" th:text="'TODO'"/>
              </div>
              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key" th:text="#{viewClaim.summary.matterType1}"/>
                <dd class="govuk-summary-list__value" th:text="'TODO'"/>
              </div>
              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key" th:text="#{viewClaim.summary.matterType2}"/>
                <dd class="govuk-summary-list__value" th:text="'TODO'"/>
              </div>
              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key" th:text="#{viewClaim.summary.caseStartDate}"/>
                <dd class="govuk-summary-list__value" th:text="'TODO'"/>
              </div>
              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key" th:text="#{viewClaim.summary.dateOfWorkConcluded}"/>
                <dd class="govuk-summary-list__value" th:text="'TODO'"/>
              </div>
              <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key" th:text="#{viewClaim.summary.escapedCase}"/>
                <dd class="govuk-summary-list__value" th:text="'TODO'"/>
              </div>
            </dl>
          </div>
        </div>
        </p>
      </div>

    </div>
  </div>
</main>
</html>
