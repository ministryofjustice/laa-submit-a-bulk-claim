<th:block th:fragment="form(submissionSearchQuery)">
  <div class="search-panel govuk-!-margin-bottom-6">
    <div class="govuk-grid-row">

      <div class="govuk-grid-column-one-third">
        <fieldset class="govuk-fieldset">

          <div class="govuk-body govuk-input--width-10">
            <div class="autocomplete-wrapper ">
              <label class="govuk-label govuk-label--s" for="submission-period"
                     th:text="#{search.submissionPeriod}"></label>
              <select class="govuk-select" id="submission-period"
                      th:field="*{submissionPeriod}"
                      data-module="make-autocomplete">

                <option value="" selected></option>
                <option
                    th:each="period, idx : ${@submissionPeriodUtil.getAllPossibleSubmissionPeriods()}"
                    th:value="${period.getKey()}"
                    th:id="|submission-period-${idx.index}|"
                    th:text="${period.getValue()}">Submission Period Option
                </option>
              </select>
            </div>
          </div>
        </fieldset>
      </div>
      <div class="govuk-grid-column-one-third">
        <fieldset class="govuk-fieldset">

          <div class="govuk-body govuk-input--width-10">
            <label class="govuk-label govuk-label--s" for="area-of-law"
                   th:text="#{search.areaOfLaw}"></label>
            <select class="govuk-select" id="area-of-law"
                    th:field="*{areaOfLaw}">

              <option value="" th:text="#{search.error.areaOfLaw.all}" selected>All</option>
              <option
                  value="LEGAL HELP"
                  th:text="#{search.areaOfLaw.legalHelp}"></option>
              <option
                  value="CRIME LOWER"
                  th:text="#{search.areaOfLaw.crimeLower}"></option>
              <option
                  value="MEDIATION"
                  th:text="#{search.areaOfLaw.mediation}"></option>

            </select>
          </div>
        </fieldset>
      </div>
      <div class="govuk-grid-column-full">
        <div class="govuk-form-group"
             th:classappend="${#fields.hasErrors('submissionStatuses')} ? 'govuk-form-group--error' : ''">
          <fieldset class="govuk-fieldset">
            <legend class="govuk-fieldset__legend govuk-fieldset__legend--s"
                    th:text="#{search.outcome}">
            </legend>
            <th:block th:replace="~{fragments/error-components :: error-messages('submissionStatuses')}"/>
            <div class="govuk-checkboxes govuk-checkboxes--small"
                 data-module="govuk-checkboxes" id="submission-statuses-input">
              <div class="govuk-checkboxes__item"
                   th:each="status, idx : ${T(uk.gov.justice.laa.payments.submit.dto.SubmissionOutcomeFilter).values()}">
                <input class="govuk-checkboxes__input"
                       type="checkbox"
                       name="submissionStatuses"
                       th:id="${idx.first} ? 'submissionStatuses-input' : |submission-status-${status.name()}|"
                       th:value="${status.name()}"
                       th:checked="${submissionSearchQuery.submissionStatuses != null and #lists.contains(submissionSearchQuery.submissionStatuses, status)}">
                <label class="govuk-label govuk-checkboxes__label"
                       th:for="${idx.first} ? 'submissionStatuses-input' : |submission-status-${status.name()}|"
                       th:text="#{${'search.outcome.' + status.name()}}">
                </label>
              </div>
            </div>
          </fieldset>
        </div>
      </div>


      <div class="govuk-grid-column-full">
        <details class="govuk-details" th:open="${#fields.hasErrors('offices') || shouldOpenOfficeDetails == true}">
          <summary class="govuk-details__summary"
                   id="choose-office-account-details-summary">
              <span class="govuk-details__summary-text"
                    th:text="#{search.result.header.chooseOffice}">
              </span>
          </summary>
          <div class="govuk-details__text">
            <div class="govuk-form-group" th:classappend="${#fields.hasErrors('offices')} ? 'govuk-form-group--error' : ''">
              <fieldset class="govuk-fieldset">
                <legend class="govuk-fieldset__legend govuk-fieldset__legend--s"
                        id="office-account-legend"
                        th:text="#{search.offices}">
                </legend>
                <th:block th:replace="~{fragments/error-components :: error-messages('offices')}"/>

                <div class="govuk-checkboxes govuk-checkboxes--small govuk-!-margin-bottom-2 requires-js"
                     id="offices-select-all-container"
                     th:if="${userOffices != null and userOffices.size() > 1}">
                  <div class="govuk-checkboxes__item govuk-!-margin-bottom-0">
                    <input class="govuk-checkboxes__input"
                           id="offices-select-all"
                           type="checkbox"
                           data-module="laa-select-all"
                           data-target="offices-input-container">
                    <label class="govuk-label govuk-checkboxes__label"
                           for="offices-select-all"
                           th:text="#{search.offices.selectAll}"></label>
                  </div>
                </div>

                <div class="govuk-checkboxes govuk-checkboxes--small"
                     data-module="govuk-checkboxes" id="offices-input-container">

                  <th:block th:each="office,idx : ${userOffices}">
                    <div class="govuk-checkboxes__item govuk-!-margin-bottom-0">
                      <input class="govuk-checkboxes__input"
                             th:id="${idx.index > 0} ? |offices-input-${idx.index}| : |offices-input|"
                             type="checkbox"
                             name="offices"
                             th:checked="${submissionSearchQuery.offices != null and #arrays.contains(submissionSearchQuery.offices, office)}"
                             th:value="${office}">
                      <label class="govuk-label govuk-checkboxes__label"
                             th:for="${idx.index > 0} ? |offices-input-${idx.index}| : |offices-input|"
                             th:text="${office}">
                      </label>
                    </div>
                  </th:block>

                </div>
              </fieldset>
            </div>
          </div>
        </details>
      </div>

      <div class="govuk-grid-column-full">
        <div class="govuk-button-group">
          <button
              type="submit"
              class="govuk-button"
              data-module="govuk-button"
              id="searchButton" th:text="#{search.button.primary}"></button>
          <a class="govuk-link" id="clearAllLink" th:href="@{/submissions/search}" th:text="#{search.button.clearAll}"></a>
        </div>
      </div>
    </div>
  </div>
</th:block>
