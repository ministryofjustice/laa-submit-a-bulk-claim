  law you''re claiming for. The maximum size is {0} per file.
landing.beforeStart.files.two=Files can be in XML, CSV or TXT format that have been created by your \
  case management system, or use the <a class="govuk-link govuk-link--no-visited-state" href="{0}" \
  target="_blank" rel="noopener noreferrer">bulkload spreadsheet</a>. \
  You can also use the <a class="govuk-link govuk-link--no-visited-state" href="{1}" \
  target="_blank" rel="noopener noreferrer">bulkload spreadsheet guide</a> \
  for help on how to prepare it.
